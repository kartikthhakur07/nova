services:
  - type: web
    name: nova-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SQLITE_PATH
        value: ./vigil.db
      - key: RIME_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        value: llama3.1:8b
      - key: VITE_ORIGIN
        sync: false
